[pytest]
# Pytest configuration for data pipeline testing
testpaths = tests

# Collect only specific critical test patterns
collect_ignore =
    tests/test_autogen_integration.py
    tests/test_youtube_autogen_integration.py
    tests/test_autogen_routes.py
    tests/test_enhanced_financial_analyst.py
    tests/test_debate_integration.py
    tests/test_cross_platform_integration.py
    tests/test_database_integration.py

# Focus on critical data pipeline tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Verbose output
addopts = -v --tb=short

# Async support
asyncio_mode = auto

# Warnings
filterwarnings =
    ignore::DeprecationWarning:pydantic
    ignore::DeprecationWarning:fastapi
