top_issues:
  - severity: medium
    category: implementation_gap
    title: 'Redis Integration Not Implemented'
    description: |
      Story 4.0e Acceptance Criteria AC3, AC8, and AC17 specify "Railway Redis integration for API response caching"
      and "Railway Redis cache fallback when database unavailable". However, Redis is only stubbed in the code
      (SignalOrchestratorV2.ts:351-356 returns null with TODO comment).

      ROOT CAUSE: Story was poorly defined with conflicting requirements:
      - Task 1.1 mentions "Supabase → Substack → Vercel KV"
      - Task 1.4 mentions "Redis"
      - Acceptance Criteria mention "Railway Redis"
      - Story 4.0b (dependency) only implemented PostgreSQL, not Redis

      The developer made smart choices (PostgreSQL + memory cache work well), but Redis ACs are not met.
    impact: |
      - Performance: Unknown impact without Redis caching layer
      - Reliability: PostgreSQL load may be higher without Redis cache
      - Targets: <500ms cached response target may not be achievable
    refs:
      - 'domains/data-pipeline/src/services/SignalOrchestratorV2.ts:351-356'
      - 'docs/stories/4.0e.api-consolidation.md:30 (AC3)'
      - 'docs/stories/4.0e.api-consolidation.md:37 (AC8)'
      - 'docs/stories/4.0e.api-consolidation.md:53 (AC17)'
    suggested_owner: dev

  - severity: medium
    category: validation_gap
    title: 'Performance Targets Not Load Tested'
    description: |
      Story specifies performance targets (<500ms cached, <2s fresh data) but no load testing
      has been performed to validate these targets are achievable with current implementation.

      Artillery load tests are mentioned in story (line 461-464) but not executed.
    impact: |
      - Unknown if performance SLAs can be met in production
      - Memory cache size (100 entries) may be insufficient
      - PostgreSQL query performance under load is unknown
    refs:
      - 'docs/stories/4.0e.api-consolidation.md:59-64 (Performance ACs)'
      - 'docs/stories/4.0e.api-consolidation.md:461-464 (Load testing plan)'
    suggested_owner: dev

  - severity: low
    category: implementation_gap
    title: 'Rate Limiting Not Implemented'
    description: |
      Acceptance Criteria AC18 and AC27 specify rate limiting middleware, but this is not implemented.
      Infrastructure is prepared (authentication middleware, logging) but rate limiting logic is missing.
    impact: |
      - No protection against brute force authentication attempts
      - No protection against API abuse/scraping
      - Cannot enforce different limits per tier (free/pro/enterprise)
    refs:
      - 'docs/stories/4.0e.api-consolidation.md:54 (AC18)'
      - 'docs/stories/4.0e.api-consolidation.md:68 (AC27)'
    suggested_owner: dev

