# Test Execution Instructions
test_execution:
  setup:
    - "Ensure Next.js frontend is running: npm run dev (port 3000)"
    - "Ensure debate server is running: python -m uvicorn apps.backend.mcp_debate_tester:app --port 8002"
    - "Set environment variables: OPENAI_API_KEY, PERPLEXITY_API_KEY, etc."

  run_tests:
    - "Run full test suite: pytest apps/backend/tests/test_debate_integration.py -v"
    - "Run specific test class: pytest apps/backend/tests/test_debate_integration.py::TestYouTubeDebateWorkflow -v"
    - "Run with asyncio mode: pytest apps/backend/tests/test_debate_integration.py -v --asyncio-mode=auto"

  interactive_testing:
    - "Install MCP Inspector: npm install -g @modelcontextprotocol/inspector"
    - "Launch Inspector: npx @modelcontextprotocol/inspector"
    - "Connect to: http://localhost:8002/mcp"
    - "Navigate to Tools → List Tools to see all debate endpoints"
    - "Select endpoint, fill parameters, click Run Tool to test interactively"

