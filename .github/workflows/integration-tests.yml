name: Integration Tests

on:
  push:
    branches: [main, develop, fix/data-pipeline-restructuring]
    paths:
      - 'domains/data-pipeline/**'
      - '.github/workflows/integration-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'domains/data-pipeline/**'
  workflow_dispatch:  # Manual trigger

jobs:
  integration-tests:
    name: Integration Tests (Railway PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: domains/data-pipeline/package-lock.json

      - name: Install dependencies
        working-directory: domains/data-pipeline
        run: npm ci

      - name: Generate Prisma Client
        working-directory: domains/data-pipeline
        run: npx prisma generate --schema=./prisma/schema.prisma

      - name: Run database migrations
        working-directory: domains/data-pipeline
        run: npx prisma migrate deploy --schema=./prisma/schema.prisma

      - name: Verify database connection
        run: |
          PGPASSWORD=test_password psql -h localhost -U test_user -d test_db -c '\dt'

      - name: Run integration tests
        working-directory: domains/data-pipeline
        run: npm run test:integration
        timeout-minutes: 10

      - name: Generate coverage report
        if: always()
        working-directory: domains/data-pipeline
        run: npm run test:coverage -- --testPathPattern=integration
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./domains/data-pipeline/coverage/coverage-final.json
          flags: integration
          name: integration-tests
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration
          path: |
            domains/data-pipeline/coverage/
            domains/data-pipeline/test-results/
          retention-days: 30

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request' && always()
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: ./domains/data-pipeline/coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}

  load-tests:
    name: Load Tests (Artillery)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Artillery
        run: npm install -g artillery@latest

      - name: Install dependencies
        working-directory: domains/data-pipeline
        run: npm ci

      - name: Start test server
        working-directory: domains/data-pipeline
        run: npm run dev &
        env:
          PORT: 3001
          NODE_ENV: test

      - name: Wait for server
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:3001/health; do sleep 2; done'

      - name: Run load tests
        working-directory: domains/data-pipeline
        run: |
          artillery run test-scenarios/load-test.yml \
            --output artillery-results.json
        timeout-minutes: 15

      - name: Generate HTML report
        if: always()
        working-directory: domains/data-pipeline
        run: |
          artillery report artillery-results.json \
            --output artillery-report.html
        continue-on-error: true

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            domains/data-pipeline/artillery-results.json
            domains/data-pipeline/artillery-report.html
          retention-days: 30

      - name: Check performance thresholds
        if: always()
        working-directory: domains/data-pipeline
        run: |
          node -e "
            const results = require('./artillery-results.json');
            const summary = results.aggregate;

            console.log('Performance Summary:');
            console.log('  Total requests:', summary.counters['http.requests']);
            console.log('  Errors:', summary.counters['errors.ETIMEDOUT'] || 0);
            console.log('  p50:', summary.summaries['http.response_time'].p50);
            console.log('  p95:', summary.summaries['http.response_time'].p95);
            console.log('  p99:', summary.summaries['http.response_time'].p99);

            // Enforce thresholds
            const p95 = summary.summaries['http.response_time'].p95;
            if (p95 > 1000) {
              console.error('FAILED: p95 latency exceeded 1000ms threshold');
              process.exit(1);
            }
          "

  coverage-check:
    name: Coverage Enforcement
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-results-integration
          path: ./coverage

      - name: Check coverage thresholds
        run: |
          echo "Checking coverage thresholds..."
          # This would parse coverage report and enforce >90% line, >85% branch
          # Implementation depends on coverage tool format

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [integration-tests, load-tests, coverage-check]
    if: always()

    steps:
      - name: Send Slack notification
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Integration tests failed for ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Integration Tests Failed*\nBranch: `${{ github.ref_name }}`\nCommit: `${{ github.sha }}`"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
